name: Build unsigned iOS IPA

# Produces an UNSIGNED .ipa on GitHub's free macOS runners.
# Download the artifact, then sign + install it on your iPhone with Sideloadly
# (or AltStore) using a free Apple ID. No Mac or paid Apple account required.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "App.tsx"
      - "app.json"
      - "package.json"
      - ".github/workflows/ios-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Resolve workspace and scheme
        id: xc
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"

      - name: Build app (no code signing)
        working-directory: ios
        run: |
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build/dd" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP=$(find build/dd/Build/Products -type d -name "*.app" | head -n1)
          if [ -z "$APP" ]; then
            echo "No .app was produced by the build." >&2
            find build -type d -name "*.app" >&2 || true
            exit 1
          fi
          echo "Using app bundle: $APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry app-unsigned.ipa Payload)
          ls -lh build/app-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: brain-bee-unsigned-ipa
          path: ios/build/app-unsigned.ipa
          if-no-files-found: error
